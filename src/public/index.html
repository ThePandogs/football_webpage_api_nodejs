<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Information</title>
  <link href='https://fonts.googleapis.com/css?family=Lato:300,400,700' rel='stylesheet' type='text/css'>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
    }

    .star {
      position: absolute;
      border-radius: 50%;
      background: white;
      opacity: 1;
      animation: fall 5s linear infinite, twinkle 1s infinite alternate;
    }

    @keyframes twinkle {
      0% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    @keyframes fall {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(100vh); opacity: 0; }
    }

    .container {
      text-align: center;
      background-color: rgba(255, 255, 255, 0.9);
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
      padding: 40px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80%;
      max-width: 600px;
    }

    h1 {
      color: #333;
      font-family: 'Lato', sans-serif;
      font-size: 2.5em;
      margin: 0 0 20px;
    }

    p {
      color: #666;
      margin: 10px 0;
      font-size: 1.2em;
    }

    a {
      color: #1052a8;
      text-decoration: none;
      font-weight: bold;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>API Information</h1>
    <p>Official Page <a href="https://Thepandogs.dev" target="_blank">thepandogs.dev</a></p>
    <p>Author: Carlos Fraile</p>
    <p>Github: <a href="https://github.com/thepandogs" target="_blank">Github</a></p>
    <p>For Sport WebPage: <a href="https://football-webpage.vercel.app" target="_blank">football-webpage.vercel.app</a></p>
  </div>

  <script>
    const numStars = 100;

    function createStar() {
      const star = document.createElement('div');
      const size = Math.random() * 3 + 1;
      star.classList.add('star');
      star.style.width = `${size}px`;
      star.style.height = `${size}px`;
      star.style.left = `${Math.random() * 100}vw`;
      star.style.top = `${Math.random() * 100}vh`;
      star.style.animationDuration = `${Math.random() * 5 + 5}s`;
      document.body.appendChild(star);

      star.addEventListener('animationend', () => {
        star.remove();
        createStar();
      });
    }

    for (let i = 0; i < numStars; i++) {
      createStar();
    }

    setInterval(createStar, 1000);
  </script>
</body>
</html>
